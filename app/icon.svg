    </pattern>
    <clipPath id="r"><rect width="64" height="64" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="64" height="64" fill="url(#sky)"/>
    <!-- bare tree -->
    <g stroke="#f6e4e2" stroke-linecap="round" fill="none">
      <path d="M-1 30 L9 18 L14 7" stroke-width="1.6"/>
      <path d="M9 18 L16 16 M6 22 L1 14 M11 13 L17 9 M12 11 L8 4 M4 24 L13 25" stroke-width="1"/>
    </g>
