    <path d="M0 37 L5 35 L10 37 L16 34 L22 36 L28 33 L36 35 L42 33 L48 35 L55 33 L64 34 L64 46 L0 48 Z" fill="#8a1a1c"/>
    <path d="M4 41 L9 39 L11 42 Z M47 38 L52 36 L56 39 L50 40 Z M58 38 L62 37 L63 41 Z" fill="#f6e4e2"/>
